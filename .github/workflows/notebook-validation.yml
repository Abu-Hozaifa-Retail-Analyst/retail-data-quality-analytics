
name: Retail Notebook Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notebook validation dependency
        run: python -m pip install nbformat

      - name: Validate retail notebooks
        run: |
          python -c "from pathlib import Path; import nbformat; files = sorted(Path('python').glob('*.ipynb')); assert files, 'No notebooks found'; [nbformat.validate(nbformat.read(p, as_version=4)) for p in files]; print(f'PASS: {len(files)} notebooks are structurally valid.')"
