
name: Retail Notebook Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install notebook validation dependency
        run: python -m pip install nbformat pandas
      - name: Validate retail notebooks
        run: |
          python -c "from pathlib import Path; import nbformat; files = sorted(Path('python').glob('*.ipynb')); assert files, 'No notebooks found'; [nbformat.validate(nbformat.read(p, as_version=4)) for p in files]; print(f'PASS: {len(files)} notebooks are structurally valid.')"
      - name: Validate data-quality report integrity
        run: |
          python -c "
          import pandas as pd
          from pathlib import Path
          report_path = Path('data/processed/data_validation_results.csv')
          assert report_path.is_file(), 'Validation report not found'
          df = pd.read_csv(report_path)
          valid_statuses = {'PASS', 'FAIL', 'REVIEW'}
          assert not df.empty, 'Validation report is empty'
          assert df['status'].notna().all(), 'Missing status values'
          assert df['status'].isin(valid_statuses).all(), 'Unexpected status value'
          assert df['records_tested'].notna().all(), 'Missing records_tested values'
          assert df['failed_records'].notna().all(), 'Missing failed_records values'
          assert (df['records_tested'] >= 0).all(), 'Negative records_tested value'
          assert (df['failed_records'] >= 0).all(), 'Negative failed_records value'
          assert (df['failed_records'] <= df['records_tested']).all(), 'Failed records exceed records tested'
          print(f'PASS: {len(df)} validation results passed report-integrity checks.')
          print(df['status'].value_counts().to_string())
          "
